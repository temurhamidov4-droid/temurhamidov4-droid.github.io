    .page {
      position: relative;

    .phone { left: 19.2%; top: 76.8%; width: 61.8%; height: 6.0%; }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1.2%;
      text-align: center;
      color: rgba(255,255,255,.25);
      font-size: clamp(9px, 1.2vw, 13px);
      pointer-events: none;
    }
  </style>
</head>
